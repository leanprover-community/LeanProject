name: Build and Deploy Pages

# This workflow builds a GitHub Pages site with the upstreaming dashboard. It is disabled by
# default: only the manual trigger is active. Choose one of the following:
#
# - Your project has a blueprint: delete this file and the `website` folder. The workflow that
#   `leanblueprint new` creates should deploy the site instead. See the README, section
#   "Blueprint", step 4, to add the dashboard there.
# - Your project has no blueprint: uncomment the `push` and `schedule` triggers below, then
#   delete this comment.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #     - master
  # schedule:
  #   - cron: '0 6 * * *'

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `blueprint.yml`, created by `leanblueprint new`, deploys the whole site too. Running both
      # workflows would overwrite the site, so stop here when that file exists.
      - name: Stop if a blueprint workflow exists
        run: test ! -f .github/workflows/blueprint.yml || { echo "::error::blueprint.yml also deploys the site; see the README, Blueprint, step 4"; exit 1; }

      # See https://github.com/leanprover-community/upstreaming-dashboard-action
      # for more details on how this action works and its parameters
      - name: Generate upstream dashboard snippets
        uses: leanprover-community/upstreaming-dashboard-action@cdeaeff56d9531a75a19e8b9106def00c588c688 # main as of 2026-10-12
        with:
          website-directory: website
          project-name: Project
          branch-name: ${{ github.event.repository.default_branch }}
          # include-drafts: false             # Include draft PRs in the dashboard?
          # relevant-labels: "label1,label2"  # Group PRs by 'relevant' based on these labels

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: website
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
